name: Noobs-Container-Searcher
version: '${version}'
main: de.noobs.containersearcher.NoobsContainerSearcher
api-version: '1.21'
description: Syncs chest contents into the search of the client mod Noob's Container Searcher – for you, your group and your friends.

commands:
  truhe:
    description: Chest owner info and friends who see all your chests
    usage: /ncs help
    aliases: [ncs, kiste]
    permission: ncs.use
  gruppe:
    description: Group – all members see all chests of the group in the search
    usage: /group help
    aliases: [group, ncsgroup]
    permission: ncs.use

permissions:
  ncs.use:
    description: Use /ncs and /group
    default: true
  ncs.admin:
    description: See full info of every chest; /ncs reload
    default: op
    children:
      ncs.use: true
