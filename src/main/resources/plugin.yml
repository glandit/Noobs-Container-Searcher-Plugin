name: Noobs-Container-Searcher
version: '${version}'
main: de.noobs.containersearcher.NoobsContainerSearcher
api-version: '1.21'
description: Lock chests and share them with players, friends and groups.

commands:
  truhe:
    description: Lock chests and share them with players
    usage: /ncs help
    aliases: [ncs, kiste]
    permission: ncs.use
  gruppe:
    description: Group – all members share all chests
    usage: /group help
    aliases: [group, ncsgroup]
    permission: ncs.use

permissions:
  ncs.use:
    description: Lock and share your own chests
    default: true
  ncs.admin:
    description: Open, break and manage every chest; /ncs reload
    default: op
    children:
      ncs.use: true
