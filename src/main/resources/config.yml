# ============================================================
#  Noobs-Container-Searcher – chest contents for the mod search
#  (Truheninhalte für die Mod-Suche)
# ============================================================
# The server remembers what is in every chest that has an owner and sends it to the
# client mod "Noob's Container Searcher": to the owner, the owner's group and friends.
# Nothing is protected – everyone can open and break every chest, like in vanilla.
#
# Der Server merkt sich, was in jeder Truhe mit Besitzer liegt, und schickt es an den
# Client-Mod: an den Besitzer, seine Gruppe und seine Freunde. Geschützt wird nichts.

# Language of all messages / Sprache aller Nachrichten:
#   auto  = each player gets their own game language (fallback: English)
#           jeder Spieler bekommt seine Spielsprache (sonst Englisch)
#   en_us, de_de, pt_br, ru_ru, tr_tr = same language for everyone
# Texts can be edited in plugins/Noobs-Container-Searcher/lang/<language>.yml.
# A new file there (e.g. fr_fr.yml) adds a language.
language: auto

# Which blocks get an owner and are synced (material names).
# SHULKER_BOXES = all 17 shulker boxes.
# Welche Blöcke einen Besitzer bekommen und gesynct werden.
tracked-blocks:
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - SHULKER_BOXES

# A new chest belongs to the player who places it. Chests from before the plugin was
# installed (and loot chests) belong to the first player who opens them.
# false = only placed chests get an owner.
# Neue Truhen gehören dem, der sie platziert. Ältere Truhen gehören dem, der sie als
# Erster öffnet. false = nur platzierte Truhen bekommen einen Besitzer.
claim-on-first-open: true

# How far away /ncs info works (blocks, max. 10).
target-distance: 5

# Groups (/group): every member sees all chests of all members in the mod search.
groups:
  # How long an invitation is valid (seconds).
  invite-seconds: 300
