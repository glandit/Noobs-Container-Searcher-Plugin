# Deutsch – MiniMessage-Format: https://docs.advntr.dev/minimessage/format.html
prefix: "<dark_gray>[<gold>Truhe</gold>]</dark_gray> "
nobody: "niemand"

no-player: "<red>Nur Spieler können diesen Befehl nutzen."
no-permission: "<red>Dafür hast du keine Rechte."
no-target: "<red>Schau eine Truhe oder ein Fass an (max. <distance> Blöcke entfernt)."
unknown-player: "<red>Spieler <white><player></white> war noch nie auf dem Server."
reloaded: "<green>Konfiguration neu geladen."
too-far: "<red>Schau die Truhe aus der Nähe an, um sie zu sichern."
chest-unavailable: "<red>Truhe nicht gefunden – ist sie in der Nähe und geladen?"

usage-share: "<red>Benutzung: <white>/<label> teilen [Spieler]"
usage-unshare: "<red>Benutzung: <white>/<label> entziehen [Spieler]"
usage-trust: "<red>Benutzung: <white>/<label> vertrauen [Spieler]"
usage-untrust: "<red>Benutzung: <white>/<label> misstrauen [Spieler]"
usage-group-create: "<red>Benutzung: <white>/<label> erstellen [Name]"
usage-group-invite: "<red>Benutzung: <white>/<label> einladen [Spieler]"
usage-group-kick: "<red>Benutzung: <white>/<label> entfernen [Spieler]"

# Schutz
denied: "<red>Diese Truhe gehört <white><owner></white>. Du hast keinen Zugriff."
denied-break: "<red>Nur <white><owner></white> darf diese Truhe abbauen."
denied-extend: "<red>Die Truhe daneben gehört <white><owner></white>. Schleiche beim Platzieren, um keine Doppeltruhe zu bauen."
auto-locked: "<green>Truhe gesichert. <gray>Teilen: <white>/truhe teilen [Spieler]"
extended: "<green>Doppeltruhe gesichert – Freigaben übernommen."
admin-access: "<gold>Admin-Zugriff: Truhe von <white><owner>"
break-unlocked: "<gray>Truhe abgebaut – Schutz entfernt."

# sperren / entsperren
locked: "<green>Truhe gesichert. Nur du hast Zugriff."
already-locked: "<yellow>Diese Truhe gehört dir schon."
locked-by-other: "<red>Diese Truhe gehört bereits <white><owner></white>."
not-locked: "<yellow>Diese Truhe ist nicht gesichert."
not-owner: "<red>Das darf nur der Besitzer <white><owner></white>."
unlocked: "<green>Schutz entfernt. Jeder kann die Truhe jetzt öffnen."

# teilen / entziehen
shared: "<green>Truhe mit <white><player></white> geteilt."
shared-notify: "<white><owner></white> <green>hat eine Truhe mit dir geteilt <gray>(<x>, <y>, <z>)</gray>."
already-shared: "<yellow><white><player></white> hat schon Zugriff auf diese Truhe."
share-self: "<yellow>Der Besitzer hat immer Zugriff."
unshared: "<green><white><player></white> hat keinen Zugriff mehr auf diese Truhe."
not-shared: "<yellow>Diese Truhe ist nicht mit <white><player></white> geteilt."

# info
info-unlocked: "<gray>Diese Truhe ist <white>nicht gesichert</white>. <gray>Sichern: <white>/truhe sperren"
info:
  - "<dark_gray>――――――― <gold>Truhen-Info</gold> ―――――――"
  - "<gold>Besitzer: <white><owner>"
  - "<gold>Geteilt mit: <white><shared>"
  - "<gold>Freunde des Besitzers: <white><friends>"
  - "<gold>Gruppe des Besitzers: <white><group>"
info-member:
  - "<dark_gray>――――――― <gold>Truhen-Info</gold> ―――――――"
  - "<gold>Besitzer: <white><owner>"
  - "<gold>Geteilt mit: <white><shared>"
  - "<gold>Gruppe des Besitzers: <white><group>"

# vertrauen / misstrauen / freunde
trusted: "<green><white><player></white> hat jetzt Zugriff auf <white>alle</white> deine Truhen."
trusted-notify: "<white><owner></white> <green>vertraut dir: Du hast Zugriff auf alle Truhen von <white><owner></white>."
already-trusted: "<yellow><white><player></white> ist schon dein Freund."
trust-self: "<yellow>Dir selbst musst du nicht vertrauen. ;)"
untrusted: "<green><white><player></white> hat keinen Zugriff mehr auf deine Truhen."
not-trusted: "<yellow><white><player></white> ist nicht in deiner Freundesliste."
trust-list: "<gold>Freunde (Zugriff auf alle Truhen): <white><list>"

help:
  - "<dark_gray>――――― <gold>Noobs-Container-Searcher</gold> ―――――"
  - "<gray>Schau eine Truhe an und nutze:"
  - "<white>/<label> teilen [Spieler]</white> <gray>– Truhe mit Spieler teilen"
  - "<white>/<label> entziehen [Spieler]</white> <gray>– Zugriff wieder wegnehmen"
  - "<white>/<label> info</white> <gray>– Besitzer & Freigaben anzeigen"
  - "<white>/<label> sperren</white> <gray>/ <white>entsperren</white> <gray>– Schutz an/aus"
  - "<gray>Für alle deine Truhen:"
  - "<white>/<label> vertrauen [Spieler]</white> <gray>– Freund hinzufügen"
  - "<white>/<label> misstrauen [Spieler]</white> <gray>– Freund entfernen"
  - "<white>/<label> freunde</white> <gray>– Freundesliste"
  - "<gray>Für eure ganze Gruppe: <white>/gruppe hilfe"

# gruppe
group-help:
  - "<dark_gray>――――――― <gold>Gruppe</gold> ―――――――"
  - "<gray>In einer Gruppe hat jeder Zugriff auf <white>alle</white> Truhen aller Mitglieder."
  - "<white>/<label> erstellen [Name]</white> <gray>– neue Gruppe gründen"
  - "<white>/<label> einladen [Spieler]</white> <gray>– Spieler einladen (nur Anführer)"
  - "<white>/<label> annehmen</white> <gray>/ <white>ablehnen</white> <gray>– Einladung beantworten"
  - "<white>/<label> info</white> <gray>– Mitglieder anzeigen"
  - "<white>/<label> verlassen</white> <gray>– Gruppe verlassen"
  - "<white>/<label> entfernen [Spieler]</white> <gray>– Mitglied rauswerfen (nur Anführer)"
  - "<white>/<label> auflösen</white> <gray>– Gruppe löschen (nur Anführer)"
group-info:
  - "<dark_gray>――――――― <gold>Gruppe <group></gold> ―――――――"
  - "<gold>Anführer: <white><leader>"
  - "<gold>Mitglieder (<count>): <members>"
  - "<gray>Alle Mitglieder können alle Truhen der Gruppe öffnen."
group-none: "<yellow>Du bist in keiner Gruppe. <gray>Gründen: <white>/gruppe erstellen [Name]"
group-already-member: "<yellow>Du bist schon in der Gruppe <white><group></white>. Erst <white>/gruppe verlassen</white>."
group-invalid-name: "<red>Name: 3–16 Zeichen, nur Buchstaben, Zahlen, _ und -."
group-name-taken: "<red>Die Gruppe <white><group></white> gibt es schon."
group-created: "<green>Gruppe <white><group></white> gegründet! <gray>Lade Leute ein: <white>/gruppe einladen [Spieler]"
group-not-leader: "<red>Das darf nur der Anführer <white><leader></white>."
group-player-offline: "<red><white><player></white> ist gerade nicht online."
group-already-in: "<yellow><white><player></white> ist schon in deiner Gruppe."
group-target-in-other: "<red><white><player></white> ist schon in einer anderen Gruppe."
group-invited: "<green>Einladung an <white><player></white> geschickt."
group-invite-received:
  - "<gold><white><player></white> lädt dich in die Gruppe <white><group></white> ein!"
  - "<gray>Dann teilt ihr euch <white>alle</white> Truhen. Gültig für <minutes> Min."
  - "<click:run_command:'/ncsgroup accept'><green><bold>[ANNEHMEN]</bold></green></click>  <click:run_command:'/ncsgroup decline'><red>[ablehnen]</red></click>"
group-no-invite: "<yellow>Du hast keine (gültige) Einladung."
group-joined: "<green>Willkommen in der Gruppe <white><group></white>! Ihr teilt jetzt alle Truhen."
group-member-joined: "<green><white><player></white> ist der Gruppe beigetreten."
group-declined: "<gray>Einladung in <white><group></white> abgelehnt."
group-invite-declined: "<yellow><white><player></white> hat die Einladung abgelehnt."
group-left: "<gray>Du hast die Gruppe <white><group></white> verlassen."
group-member-left: "<yellow><white><player></white> hat die Gruppe verlassen."
group-new-leader: "<gold>Du bist jetzt Anführer der Gruppe."
group-not-member: "<yellow><white><player></white> ist nicht in deiner Gruppe."
group-kick-self: "<yellow>Zum Verlassen: <white>/gruppe verlassen"
group-member-kicked: "<yellow><white><player></white> wurde aus der Gruppe entfernt."
group-you-were-kicked: "<red>Du wurdest aus der Gruppe <white><group></white> entfernt."
group-disbanded: "<red>Die Gruppe <white><group></white> wurde aufgelöst."
