# Português (Brasil) – formato MiniMessage: https://docs.advntr.dev/minimessage/format.html
prefix: "<dark_gray>[<gold>Baú</gold>]</dark_gray> "
nobody: "ninguém"

no-player: "<red>Só jogadores podem usar este comando."
no-permission: "<red>Você não tem permissão para isso."
no-target: "<red>Olhe para um baú ou barril (máx. <distance> blocos de distância)."
unknown-player: "<red>O jogador <white><player></white> nunca entrou neste servidor."
reloaded: "<green>Configuração recarregada."
too-far: "<red>Longe demais – chegue mais perto do baú para trancá-lo."
chest-unavailable: "<red>Baú não encontrado – ele está perto e carregado?"

usage-share: "<red>Uso: <white>/<label> share [jogador]"
usage-unshare: "<red>Uso: <white>/<label> unshare [jogador]"
usage-trust: "<red>Uso: <white>/<label> trust [jogador]"
usage-untrust: "<red>Uso: <white>/<label> untrust [jogador]"
usage-group-create: "<red>Uso: <white>/<label> create [nome]"
usage-group-invite: "<red>Uso: <white>/<label> invite [jogador]"
usage-group-kick: "<red>Uso: <white>/<label> kick [jogador]"

# Proteção
denied: "<red>Este baú pertence a <white><owner></white>. Você não tem acesso."
denied-break: "<red>Só <white><owner></white> pode quebrar este baú."
denied-extend: "<red>O baú ao lado pertence a <white><owner></white>. Agache ao colocar para não formar um baú duplo."
auto-locked: "<green>Baú trancado. <gray>Compartilhar: <white>/ncs share [jogador]"
extended: "<green>Baú duplo trancado – compartilhamentos mantidos."
admin-access: "<gold>Acesso de admin: baú de <white><owner>"
break-unlocked: "<gray>Baú quebrado – proteção removida."

# trancar / destrancar
locked: "<green>Baú trancado. Só você tem acesso."
already-locked: "<yellow>Este baú já é seu."
locked-by-other: "<red>Este baú já pertence a <white><owner></white>."
not-locked: "<yellow>Este baú não está trancado."
not-owner: "<red>Só o dono <white><owner></white> pode fazer isso."
unlocked: "<green>Proteção removida. Qualquer um pode abrir o baú agora."

# compartilhar
shared: "<green>Baú compartilhado com <white><player></white>."
shared-notify: "<white><owner></white> <green>compartilhou um baú com você <gray>(<x>, <y>, <z>)</gray>."
already-shared: "<yellow><white><player></white> já tem acesso a este baú."
share-self: "<yellow>O dono sempre tem acesso."
unshared: "<green><white><player></white> não tem mais acesso a este baú."
not-shared: "<yellow>Este baú não está compartilhado com <white><player></white>."

# info
info-unlocked: "<gray>Este baú <white>não está trancado</white>. <gray>Trancar: <white>/ncs lock"
info:
  - "<dark_gray>――――――― <gold>Info do baú</gold> ―――――――"
  - "<gold>Dono: <white><owner>"
  - "<gold>Compartilhado com: <white><shared>"
  - "<gold>Amigos do dono: <white><friends>"
  - "<gold>Grupo do dono: <white><group>"

# amigos
trusted: "<green><white><player></white> agora pode abrir <white>todos</white> os seus baús."
trusted-notify: "<white><owner></white> <green>confia em você: você pode abrir todos os baús de <white><owner></white>."
already-trusted: "<yellow><white><player></white> já é seu amigo."
trust-self: "<yellow>Você não precisa confiar em si mesmo. ;)"
untrusted: "<green><white><player></white> não pode mais abrir seus baús."
not-trusted: "<yellow><white><player></white> não está na sua lista de amigos."
trust-list: "<gold>Amigos (acesso a todos os baús): <white><list>"

help:
  - "<dark_gray>――――― <gold>Noobs-Container-Searcher</gold> ―――――"
  - "<gray>Olhe para um baú e use:"
  - "<white>/<label> share [jogador]</white> <gray>– compartilhar o baú"
  - "<white>/<label> unshare [jogador]</white> <gray>– remover o acesso"
  - "<white>/<label> info</white> <gray>– ver dono e compartilhamentos"
  - "<white>/<label> lock</white> <gray>/ <white>unlock</white> <gray>– proteção ligada/desligada"
  - "<gray>Para todos os seus baús:"
  - "<white>/<label> trust [jogador]</white> <gray>– adicionar amigo"
  - "<white>/<label> untrust [jogador]</white> <gray>– remover amigo"
  - "<white>/<label> friends</white> <gray>– lista de amigos"
  - "<gray>Para o grupo todo: <white>/group help"

# grupo
group-help:
  - "<dark_gray>――――――― <gold>Grupo</gold> ―――――――"
  - "<gray>Num grupo todos podem abrir <white>todos</white> os baús de todos os membros."
  - "<white>/<label> create [nome]</white> <gray>– criar um grupo"
  - "<white>/<label> invite [jogador]</white> <gray>– convidar um jogador (só o líder)"
  - "<white>/<label> accept</white> <gray>/ <white>decline</white> <gray>– responder a um convite"
  - "<white>/<label> info</white> <gray>– ver membros"
  - "<white>/<label> leave</white> <gray>– sair do grupo"
  - "<white>/<label> kick [jogador]</white> <gray>– remover um membro (só o líder)"
  - "<white>/<label> disband</white> <gray>– apagar o grupo (só o líder)"
group-info:
  - "<dark_gray>――――――― <gold>Grupo <group></gold> ―――――――"
  - "<gold>Líder: <white><leader>"
  - "<gold>Membros (<count>): <members>"
  - "<gray>Todos os membros podem abrir todos os baús do grupo."
group-none: "<yellow>Você não está em nenhum grupo. <gray>Criar: <white>/group create [nome]"
group-already-member: "<yellow>Você já está no grupo <white><group></white>. Use <white>/group leave</white> antes."
group-invalid-name: "<red>Nome: 3–16 caracteres, só letras, números, _ e -."
group-name-taken: "<red>O grupo <white><group></white> já existe."
group-created: "<green>Grupo <white><group></white> criado! <gray>Convide pessoas: <white>/group invite [jogador]"
group-not-leader: "<red>Só o líder <white><leader></white> pode fazer isso."
group-player-offline: "<red><white><player></white> não está online agora."
group-already-in: "<yellow><white><player></white> já está no seu grupo."
group-target-in-other: "<red><white><player></white> já está em outro grupo."
group-invited: "<green>Convite enviado para <white><player></white>."
group-invite-received:
  - "<gold><white><player></white> convidou você para o grupo <white><group></white>!"
  - "<gray>Vocês vão compartilhar <white>todos</white> os baús. Válido por <minutes> min."
  - "<click:run_command:'/ncsgroup accept'><green><bold>[ACEITAR]</bold></green></click>  <click:run_command:'/ncsgroup decline'><red>[recusar]</red></click>"
group-no-invite: "<yellow>Você não tem nenhum convite (válido)."
group-joined: "<green>Bem-vindo ao grupo <white><group></white>! Agora vocês compartilham todos os baús."
group-member-joined: "<green><white><player></white> entrou no grupo."
group-declined: "<gray>Convite para <white><group></white> recusado."
group-invite-declined: "<yellow><white><player></white> recusou o convite."
group-left: "<gray>Você saiu do grupo <white><group></white>."
group-member-left: "<yellow><white><player></white> saiu do grupo."
group-new-leader: "<gold>Agora você é o líder do grupo."
group-not-member: "<yellow><white><player></white> não está no seu grupo."
group-kick-self: "<yellow>Para sair: <white>/group leave"
group-member-kicked: "<yellow><white><player></white> foi removido do grupo."
group-you-were-kicked: "<red>Você foi removido do grupo <white><group></white>."
group-disbanded: "<red>O grupo <white><group></white> foi desfeito."
