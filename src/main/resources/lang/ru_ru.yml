# Русский – формат MiniMessage: https://docs.advntr.dev/minimessage/format.html
prefix: "<dark_gray>[<gold>Сундук</gold>]</dark_gray> "
nobody: "никто"

no-player: "<red>Эту команду могут использовать только игроки."
no-permission: "<red>У вас нет на это прав."
no-target: "<red>Посмотрите на сундук или бочку (не дальше <distance> блоков)."
unknown-player: "<red>Игрок <white><player></white> ни разу не заходил на сервер."
reloaded: "<green>Конфигурация перезагружена."
too-far: "<red>Слишком далеко – подойдите ближе к сундуку, чтобы запереть его."
chest-unavailable: "<red>Сундук не найден – он рядом и загружен?"

usage-share: "<red>Использование: <white>/<label> share [игрок]"
usage-unshare: "<red>Использование: <white>/<label> unshare [игрок]"
usage-trust: "<red>Использование: <white>/<label> trust [игрок]"
usage-untrust: "<red>Использование: <white>/<label> untrust [игрок]"
usage-group-create: "<red>Использование: <white>/<label> create [название]"
usage-group-invite: "<red>Использование: <white>/<label> invite [игрок]"
usage-group-kick: "<red>Использование: <white>/<label> kick [игрок]"

# Защита
denied: "<red>Этот сундук принадлежит <white><owner></white>. У вас нет доступа."
denied-break: "<red>Только <white><owner></white> может сломать этот сундук."
denied-extend: "<red>Соседний сундук принадлежит <white><owner></white>. Присядьте при установке, чтобы не создать двойной сундук."
auto-locked: "<green>Сундук заперт. <gray>Поделиться: <white>/ncs share [игрок]"
extended: "<green>Двойной сундук заперт – доступы сохранены."
admin-access: "<gold>Доступ администратора: сундук игрока <white><owner>"
break-unlocked: "<gray>Сундук сломан – защита снята."

# запереть / отпереть
locked: "<green>Сундук заперт. Доступ есть только у вас."
already-locked: "<yellow>Этот сундук уже ваш."
locked-by-other: "<red>Этот сундук уже принадлежит <white><owner></white>."
not-locked: "<yellow>Этот сундук не заперт."
not-owner: "<red>Это может сделать только владелец <white><owner></white>."
unlocked: "<green>Защита снята. Теперь сундук может открыть любой."

# поделиться
shared: "<green>Доступ к сундуку выдан игроку <white><player></white>."
shared-notify: "<white><owner></white> <green>поделился с вами сундуком <gray>(<x>, <y>, <z>)</gray>."
already-shared: "<yellow>У <white><player></white> уже есть доступ к этому сундуку."
share-self: "<yellow>У владельца доступ есть всегда."
unshared: "<green>У <white><player></white> больше нет доступа к этому сундуку."
not-shared: "<yellow>Этот сундук не открыт для <white><player></white>."

# информация
info-unlocked: "<gray>Этот сундук <white>не заперт</white>. <gray>Запереть: <white>/ncs lock"
info:
  - "<dark_gray>――――――― <gold>Сундук</gold> ―――――――"
  - "<gold>Владелец: <white><owner>"
  - "<gold>Доступ есть у: <white><shared>"
  - "<gold>Друзья владельца: <white><friends>"
  - "<gold>Группа владельца: <white><group>"

# друзья
trusted: "<green><white><player></white> теперь может открывать <white>все</white> ваши сундуки."
trusted-notify: "<white><owner></white> <green>доверяет вам: вы можете открывать все сундуки игрока <white><owner></white>."
already-trusted: "<yellow><white><player></white> уже ваш друг."
trust-self: "<yellow>Себе доверять не нужно. ;)"
untrusted: "<green><white><player></white> больше не может открывать ваши сундуки."
not-trusted: "<yellow><white><player></white> нет в вашем списке друзей."
trust-list: "<gold>Друзья (доступ ко всем сундукам): <white><list>"

help:
  - "<dark_gray>――――― <gold>Noobs-Container-Searcher</gold> ―――――"
  - "<gray>Посмотрите на сундук и используйте:"
  - "<white>/<label> share [игрок]</white> <gray>– поделиться сундуком"
  - "<white>/<label> unshare [игрок]</white> <gray>– забрать доступ"
  - "<white>/<label> info</white> <gray>– владелец и доступы"
  - "<white>/<label> lock</white> <gray>/ <white>unlock</white> <gray>– включить/выключить защиту"
  - "<gray>Для всех ваших сундуков:"
  - "<white>/<label> trust [игрок]</white> <gray>– добавить друга"
  - "<white>/<label> untrust [игрок]</white> <gray>– удалить друга"
  - "<white>/<label> friends</white> <gray>– список друзей"
  - "<gray>Для всей группы: <white>/group help"

# группа
group-help:
  - "<dark_gray>――――――― <gold>Группа</gold> ―――――――"
  - "<gray>В группе каждый может открывать <white>все</white> сундуки всех участников."
  - "<white>/<label> create [название]</white> <gray>– создать группу"
  - "<white>/<label> invite [игрок]</white> <gray>– пригласить игрока (только лидер)"
  - "<white>/<label> accept</white> <gray>/ <white>decline</white> <gray>– ответить на приглашение"
  - "<white>/<label> info</white> <gray>– участники"
  - "<white>/<label> leave</white> <gray>– покинуть группу"
  - "<white>/<label> kick [игрок]</white> <gray>– исключить участника (только лидер)"
  - "<white>/<label> disband</white> <gray>– распустить группу (только лидер)"
group-info:
  - "<dark_gray>――――――― <gold>Группа <group></gold> ―――――――"
  - "<gold>Лидер: <white><leader>"
  - "<gold>Участники (<count>): <members>"
  - "<gray>Все участники могут открывать все сундуки группы."
group-none: "<yellow>Вы не состоите в группе. <gray>Создать: <white>/group create [название]"
group-already-member: "<yellow>Вы уже в группе <white><group></white>. Сначала <white>/group leave</white>."
group-invalid-name: "<red>Название: 3–16 символов, только буквы, цифры, _ и -."
group-name-taken: "<red>Группа <white><group></white> уже существует."
group-created: "<green>Группа <white><group></white> создана! <gray>Пригласите игроков: <white>/group invite [игрок]"
group-not-leader: "<red>Это может сделать только лидер <white><leader></white>."
group-player-offline: "<red><white><player></white> сейчас не в сети."
group-already-in: "<yellow><white><player></white> уже в вашей группе."
group-target-in-other: "<red><white><player></white> уже состоит в другой группе."
group-invited: "<green>Приглашение отправлено игроку <white><player></white>."
group-invite-received:
  - "<gold><white><player></white> приглашает вас в группу <white><group></white>!"
  - "<gray>Вы будете делить <white>все</white> сундуки. Действует <minutes> мин."
  - "<click:run_command:'/ncsgroup accept'><green><bold>[ПРИНЯТЬ]</bold></green></click>  <click:run_command:'/ncsgroup decline'><red>[отклонить]</red></click>"
group-no-invite: "<yellow>У вас нет (действующего) приглашения."
group-joined: "<green>Добро пожаловать в группу <white><group></white>! Теперь вы делите все сундуки."
group-member-joined: "<green><white><player></white> вступил в группу."
group-declined: "<gray>Приглашение в <white><group></white> отклонено."
group-invite-declined: "<yellow><white><player></white> отклонил приглашение."
group-left: "<gray>Вы покинули группу <white><group></white>."
group-member-left: "<yellow><white><player></white> покинул группу."
group-new-leader: "<gold>Теперь вы лидер группы."
group-not-member: "<yellow><white><player></white> не состоит в вашей группе."
group-kick-self: "<yellow>Чтобы выйти: <white>/group leave"
group-member-kicked: "<yellow><white><player></white> исключён из группы."
group-you-were-kicked: "<red>Вас исключили из группы <white><group></white>."
group-disbanded: "<red>Группа <white><group></white> распущена."
