# Türkçe – MiniMessage biçimi: https://docs.advntr.dev/minimessage/format.html
# 2 = chest sync instead of chest locking; older files are backed up and replaced
file-version: 2
prefix: "<dark_gray>[<gold>Sandık</gold>]</dark_gray> "
nobody: "kimse"

no-player: "<red>Bu komutu sadece oyuncular kullanabilir."
no-permission: "<red>Bunun için iznin yok."
needs-mod: "<yellow>Bunun için <white>Noob's Container Searcher</white> modu gerekir. <gray>Mod ile arama senin, grubunun ve arkadaşlarının sandıklarını gösterir."
no-target: "<red>Bir sandığa, varile veya shulker kutusuna bak (en fazla <distance> blok)."
unknown-player: "<red><white><player></white> adlı oyuncu bu sunucuya hiç girmedi."
reloaded: "<green>Yapılandırma yeniden yüklendi."

claimed: "<green>Bu sandık artık senin. <gray>İçeriği mod aramasında sana, grubuna ve arkadaşlarına görünür."
info:
  - "<dark_gray>――――――― <gold>Sandık bilgisi</gold> ―――――――"
  - "<gold>Sahibi: <white><owner>"
  - "<gold>Sunucunun bildiği yığınlar: <white><stacks>"
  - "<gold>Gruba görünür: <white><group>"
  - "<gold>Arkadaşlara görünür: <white><friends>"
info-other:
  - "<dark_gray>――――――― <gold>Sandık bilgisi</gold> ―――――――"
  - "<gold>Sahibi: <white><owner>"
  - "<gold>Senin aramanda: <white><visible>"
info-none: "<gray>Bu sandığın henüz sahibi yok. <white>İlk açan sahibi olur.</white>"
info-none-no-claim: "<gray>Bu sandığın sahibi yok. Sadece bundan sonra yerleştirilen sandıkların sahibi olur."
word-yes: "evet"
word-no: "hayır"

usage-trust: "<red>Kullanım: <white>/<label> trust [oyuncu]"
usage-untrust: "<red>Kullanım: <white>/<label> untrust [oyuncu]"
usage-group-create: "<red>Kullanım: <white>/<label> create [ad]"
usage-group-invite: "<red>Kullanım: <white>/<label> invite [oyuncu]"
usage-group-kick: "<red>Kullanım: <white>/<label> kick [oyuncu]"

# arkadaşlar
trusted: "<green><white><player></white> artık mod aramasında <white>tüm</white> sandıklarını görüyor."
trusted-notify: "<white><owner></white> <green>seni arkadaş olarak ekledi: <white><owner></white> oyuncusunun tüm sandıklarını mod aramasında görüyorsun."
already-trusted: "<yellow><white><player></white> zaten arkadaşın."
trust-self: "<yellow>Kendine güvenmene gerek yok. ;)"
untrusted: "<green><white><player></white> artık sandıklarını görmüyor."
not-trusted: "<yellow><white><player></white> arkadaş listende değil."
trust-list: "<gold>Arkadaşlar (tüm sandıklarını görür): <white><list>"

help:
  - "<dark_gray>――――― <gold>Noobs-Container-Searcher</gold> ―――――"
  - "<gray>Sunucu sandıklarında ne olduğunu hatırlar ve mod aramasına gönderir –"
  - "<gray>sana, grubuna ve arkadaşlarına. Sandıkları açman gerekmez."
  - "<white>/<label> info</white> <gray>– baktığın sandığın sahibi"
  - "<white>/<label> trust [oyuncu]</white> <gray>– arkadaş tüm sandıklarını görür"
  - "<white>/<label> untrust [oyuncu]</white> <gray>– arkadaşı kaldır"
  - "<white>/<label> friends</white> <gray>– arkadaş listesi"
  - "<gray>Tüm grup için: <white>/group help"

# grup
group-help:
  - "<dark_gray>――――――― <gold>Grup</gold> ―――――――"
  - "<gray>Bir grupta herkes tüm üyelerin <white>tüm</white> sandıklarını mod aramasında görür."
  - "<white>/<label> create [ad]</white> <gray>– yeni grup kur"
  - "<white>/<label> invite [oyuncu]</white> <gray>– oyuncu davet et (sadece lider)"
  - "<white>/<label> accept</white> <gray>/ <white>decline</white> <gray>– daveti yanıtla"
  - "<white>/<label> info</white> <gray>– üyeleri göster"
  - "<white>/<label> leave</white> <gray>– gruptan ayrıl"
  - "<white>/<label> kick [oyuncu]</white> <gray>– üyeyi çıkar (sadece lider)"
  - "<white>/<label> disband</white> <gray>– grubu sil (sadece lider)"
group-info:
  - "<dark_gray>――――――― <gold>Grup <group></gold> ―――――――"
  - "<gold>Lider: <white><leader>"
  - "<gold>Üyeler (<count>): <members>"
  - "<gray>Tüm üyeler grubun tüm sandıklarını mod aramasında görür."
group-none: "<yellow>Hiçbir grupta değilsin. <gray>Kur: <white>/group create [ad]"
group-already-member: "<yellow>Zaten <white><group></white> grubundasın. Önce <white>/group leave</white>."
group-invalid-name: "<red>Ad: 3–16 karakter, sadece harf, rakam, _ ve -."
group-name-taken: "<red><white><group></white> grubu zaten var."
group-created: "<green><white><group></white> grubu kuruldu! <gray>Davet et: <white>/group invite [oyuncu]"
group-not-leader: "<red>Bunu sadece lider <white><leader></white> yapabilir."
group-player-offline: "<red><white><player></white> şu anda çevrimiçi değil."
group-already-in: "<yellow><white><player></white> zaten grubunda."
group-target-in-other: "<red><white><player></white> zaten başka bir grupta."
group-target-no-mod: "<red><white><player></white> oyuncusunda Noob's Container Searcher modu yok, gruplara katılamaz."
group-invited: "<green>Davet <white><player></white> adlı oyuncuya gönderildi."
group-invite-received:
  - "<gold><white><player></white> seni <white><group></white> grubuna davet ediyor!"
  - "<gray>Birbirinizin sandıklarını aramada göreceksiniz. <minutes> dk geçerli."
  - "<click:run_command:'/ncsgroup accept'><green><bold>[KABUL ET]</bold></green></click>  <click:run_command:'/ncsgroup decline'><red>[reddet]</red></click>"
group-no-invite: "<yellow>(Geçerli) bir davetin yok."
group-joined: "<green><white><group></white> grubuna hoş geldin! Artık birbirinizin sandıklarını aramada görüyorsunuz."
group-member-joined: "<green><white><player></white> gruba katıldı."
group-declined: "<gray><white><group></white> daveti reddedildi."
group-invite-declined: "<yellow><white><player></white> daveti reddetti."
group-left: "<gray><white><group></white> grubundan ayrıldın."
group-member-left: "<yellow><white><player></white> gruptan ayrıldı."
group-new-leader: "<gold>Artık grubun liderisin."
group-not-member: "<yellow><white><player></white> grubunda değil."
group-kick-self: "<yellow>Ayrılmak için: <white>/group leave"
group-member-kicked: "<yellow><white><player></white> gruptan çıkarıldı."
group-you-were-kicked: "<red><white><group></white> grubundan çıkarıldın."
group-disbanded: "<red><white><group></white> grubu dağıtıldı."
